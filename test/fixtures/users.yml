<%
  def secure_password_digest(password = 'password')
    BCrypt::Password.create(password)
  end

  @email_counter ||= 0
  def sequenced_email
    @email_counter += 1
    "user#{@email_counter}@example.com"
  end
%>

one:
  email: <%= sequenced_email %>
  password_digest: <%= secure_password_digest %>